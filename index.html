<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Tablet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Ícones gratuitos do Phosphor Icons (Via CSS puro) -->
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Backgrounds for crossfade -->
    <div class="bg" id="bg1"></div>
    <div class="bg" id="bg2" style="opacity: 0;"></div>
    <div class="bg-overlay"></div>

    <main class="dashboard-container">
        <!-- Linha 1, Col 1: Bloco do Relógio -->
        <section class="panel clock-panel glass">
            <h1 id="time" class="time-display">00:00</h1>
            <h2 id="date" class="date-display">Carregando data...</h2>
        </section>

        <!-- Linha 1, Col 2: Bloco de Notícias -->
        <section class="panel news-panel glass">
            <div class="panel-header">
                <h3><i class="ph ph-newspaper"></i> Últimas Notícias</h3>
            </div>
            <div class="news-list-container" id="news-list-container">
                <div class="news-list" id="news-list">
                    <div style="text-align: center; color: var(--text-secondary);">Carregando notícias...</div>
                </div>
            </div>
        </section>

        <!-- Linha 2, Col 1: Bloco do Clima -->
        <section class="panel weather-panel glass">
            <div class="weather-header">
                <h3><i class="ph ph-map-pin"></i> Bom Retiro, São Paulo</h3>
            </div>
            <div class="weather-current">
                <div class="temp-main">
                    <span id="current-temp">--°</span>
                </div>
                <div class="temp-minmax">
                    <div class="max"><i class="ph ph-arrow-up"></i> <span id="current-max">--°</span></div>
                    <div class="min"><i class="ph ph-arrow-down"></i> <span id="current-min">--°</span></div>
                </div>
                <div class="weather-details">
                    <div class="detail"><i class="ph ph-drop"></i> <span id="current-humidity">--%</span> Umid</div>
                    <div class="detail"><i class="ph ph-wind"></i> <span id="current-wind">--</span> km/h</div>
                    <div class="detail"><i class="ph ph-cloud-rain"></i> <span id="current-rain">--%</span> Chuva</div>
                </div>
            </div>
            <div class="weather-hourly" id="hourly-forecast">
                <!-- Forecast items injected via JS -->
            </div>
            <div class="weather-header" style="margin-top: 15px;">
                <h3><i class="ph ph-calendar-blank"></i> Próximos 5 dias</h3>
            </div>
            <div class="weather-daily" id="daily-forecast">
                <!-- Injected via JS -->
            </div>
        </section>

        <!-- Linha 2, Col 2: Bloco do Calendário -->
        <section class="panel calendar-panel glass">
            <div class="panel-header">
                <h3 id="calendar-month-year"><i class="ph ph-calendar"></i> Calendário</h3>
            </div>
            <div class="calendar-grid-wrapper">
                <div class="calendar-weekdays">
                    <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
                </div>
                <div class="calendar-grid" id="calendar-grid">
                    <!-- Dias injetados via JS -->
                </div>
            </div>
            <div class="calendar-legend" id="calendar-legend">
                <!-- Legenda dos feriados do mês -->
            </div>
        </section>    </main>

    <script src="script.js"></script>
</body>
</html>
